<ion-header>
  <ion-toolbar>
    <ion-title>Historial de mediciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (items.length > 0) {
    <ion-list inset="true">
      @for (m of items; track m.MeasureID) {
        <ion-item lines="full" [appHumidityColor]="m.Voltage">
          <ion-label>
            <ion-note>{{ m.TimestampUTC | date:'dd/MM/yyyy HH:mm' }}</ion-note>
            <p>ID de la medición : {{ m.MeasureID }}</p>
            <h2>
              <ion-text color="primary">Voltage: {{ m.Voltage }} mV</ion-text>
            </h2>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  } @else {
    <ion-item>
      <ion-label>No hay mediciones registradas</ion-label>
    </ion-item>
  }
</ion-content>
